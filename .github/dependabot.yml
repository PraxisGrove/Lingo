version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@biomejs/biome"
      # Biome minor releases change formatting and the configuration schema, so
      # they land as a deliberate migration instead of inside the dev group.
      biome:
        patterns:
          - "@biomejs/biome"
    ignore:
      # Playwright browser builds and the test runner are released together.
      # Bump them with a coordinated change to the CI cache key instead.
      - dependency-name: "playwright"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitest/browser-playwright"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
